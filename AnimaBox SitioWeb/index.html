<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimaBox | Catálogo de anime</title>
    <!-- Tipografias del proyecto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome (Usado para los botones y simbolos en el proyecto) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Hoja de estilo -->
    <link rel="stylesheet" href="estilos/style.css">
</head>

<body>
    <!--  HEADER  -->
    <header class="encabezado">
        <a href="#" class="logo" id="logoInicio">AnimaBox</a>
        <button class="boton-nav activo" id="pestanaCatalogo" type="button">
            <i class="fa-solid fa-house"></i> Inicio
        </button>
        
        <nav class="navegacion">
            <!-- Barra de busqueda -->
            <div class="buscador">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="entradaBusqueda" placeholder="Buscar por título, director o estudio..."
                    aria-label="Buscar película">
            </div>

            <!-- Botón de mi colección (Oculto por defecto, lo muestra el JS al iniciar sesión) -->
            <button class="oculto boton-nav" id="pestanaColeccion" type="button">
                <i class="fa-solid fa-bookmark"></i> Mi colección <span id="contadorColeccion">0</span>
            </button>

            <!-- Texto del usuario (Oculto por defecto) -->
            <div id="textoUsuarioPerfil" class="oculto" style="color: #7a2e3f; font-weight: bold; margin-right: 10px; display: flex; align-items: center;"></div>
            
            <!-- Botón de cerrar sesión (Oculto por defecto) -->
            <button id="btnCerrarSesion" class="oculto boton-nav" type="button" title="Cerrar Sesión">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>

            <!-- Botones para invitados (Visibles por defecto) -->
            <button id="btnAbrirLogin" class="boton-nav" type="button">Iniciar Sesión</button> 
            <button id="btnAbrirRegistro" class="boton-nav" type="button">Registrarse</button>
        </nav>
    </header>

    <!--  Slider  -->
    <section class="slider" id="slider" aria-label="Películas destacadas">
        <button class="slider-flecha" id="flechaIzquierda" aria-label="Anterior"><i
                class="fa-solid fa-chevron-left"></i></button>
        <div class="slider-contenido" id="sliderContenido"><!-- Slides clonados por JS --></div>
        <button class="slider-flecha" id="flechaDerecha" aria-label="Siguiente"><i
                class="fa-solid fa-chevron-right"></i></button>
        <div class="slider-puntos" id="sliderPuntos"></div>
    </section>

    <!-- Main principal -->
    <main class="contenedor-principal">

        <!-- Tabs de la Colección (Oculto por defecto, aparece cuando el usuario entra a "Mi colección") -->
        <div id="tabsColeccion" class="tabs-coleccion oculto">
            <h2 id="tituloColeccionUsuario" style="width:100%; text-align:center; font-family:'Archivo Black'; margin-bottom: 15px;">Colección de </h2>
            <button class="tab-btn activo" data-filtro="todos">General</button>
            <button class="tab-btn" data-filtro="favoritos">Favoritos</button>
            <button class="tab-btn" data-filtro="vistos">Ya Vistos</button>
        </div>

        <!-- Filtro (por estudio, años, generos y directores). Envuelto en un div para poder ocultarlo en la colección -->
        <section id="barraFiltrosPrincipales" class="barra-filtros" aria-label="Filtros">
            <select id="filtroEstudio">
                <option value="">Todos los estudios</option>
            </select>
            <select id="filtroAnio">
                <option value="">Todos los años</option>
            </select>
            <select id="filtroGenero">
                <option value="">Todos los géneros</option>
            </select>
            <select id="filtroDirector">
                <option value="">Todos los directores</option>
            </select>
            <button id="limpiarFiltros" class="boton-limpiar" type="button" title="Limpiar filtros">
                <i class="fa-solid fa-broom"></i>
            </button>
        </section>

        <div class="encabezado-catalogo">
            <h2 id="tituloLista">Todas las películas</h2>
            <span id="contadorResultados" aria-live="polite">Cargando...</span>
        </div>

        <!-- Mensajes de error porsi  -->
        <div id="mensajeError" class="mensaje error oculto"></div>
        <div id="mensajeVacio" class="mensaje oculto">No se encontraron películas con esos filtros.</div>

        <!-- Section de peliculas -->
        <section id="listaPeliculas" class="grid-peliculas" aria-live="polite"></section>
    </main>

    <!--  Plantilla principal  -->
    <div id="plantillaTarjeta" class="tarjeta-pelicula oculto" aria-hidden="true">
        <div class="tarjeta-poster">
            <img class="tarjeta-imagen" src="" alt="" loading="lazy">
            <!-- Overlay hover: año, director, géneros, 3 botones -->
            <div class="tarjeta-overlay">
                <p class="overlay-anio"></p>
                <p class="overlay-director"></p>
                <p class="overlay-generos"></p>
                <div class="overlay-acciones">
                    <button class="accion-icono" data-accion="catalogo" title="Agregar al catálogo">
                        <i class="fa-regular fa-bookmark"></i>
                    </button>
                    <button class="accion-icono" data-accion="favorito" title="Marcar favorito">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                    <button class="accion-icono" data-accion="visto" title="Marcar como visto">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
        </div>
        <h3 class="tarjeta-titulo"></h3>
    </div>

    <!--  Modal de detalles  -->
    <dialog id="modalDetalles" class="modal-detalles">
        <button id="cerrarModal" class="cerrar-modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
        <div id="contenidoModal"></div>
    </dialog>


    <!-- Modal de Login / Registro -->
    <dialog id="modalAuth" class="modal-auth">
        <button id="cerrarAuth" class="cerrar-modal"><i class="fa-solid fa-xmark"></i></button>

        <div id="seccionLogin">
            <h2>Iniciar Sesión</h2>
            <input type="text" id="loginUsuario" placeholder="Correo o Usuario">
            <input type="password" id="loginContrasena" placeholder="Contraseña">
            <button id="btnLogin" class="btn-primario">Entrar</button>
            <p>¿No tienes cuenta? <a href="#" id="irARegistro">Regístrate aquí</a></p>
        </div>

        <div id="seccionRegistro" class="oculto">
            <h2>Registrarse</h2>
            <input type="email" id="regCorreo" placeholder="Correo electrónico">
            <input type="text" id="regUsuario" placeholder="Nombre de usuario">
            <input type="password" id="regContrasena" placeholder="Contraseña">
            <input type="password" id="regConfirmar" placeholder="Confirmar contraseña">
            <button id="btnRegistro" class="btn-primario">Registrarse</button>
            <p>¿Ya tienes cuenta? <a href="#" id="irALogin">Inicia sesión</a></p>
        </div>
    </dialog>

    <!-- Scripts al final del body para que el DOM esté listo -->
    <script src="scripts/funcionalidades.js"></script>
    <script src="scripts/script.js"></script>
</body>

</html>
